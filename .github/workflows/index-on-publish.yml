name: Auto-index on publish

# Prévient les moteurs compatibles IndexNow (Bing, Yandex, Seznam, Naver…)
# quand des pages sont ajoutées, modifiées, supprimées ou redirigées.
# Google n'utilise pas IndexNow : pour Google, ce sont le sitemap,
# les liens internes et « Demander l'indexation » dans Search Console.
# (L'API Google Indexing est réservée aux offres d'emploi et vidéos en direct,
#  et le ping de sitemap Google n'existe plus depuis 2023 : retirés le 28/10/2026.)

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs à soumettre (séparées par des espaces). Laisser vide pour renvoyer tout le sitemap.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet pour git diff + git log lastmod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed pages
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=" >> $GITHUB_OUTPUT
            echo "redirects=" >> $GITHUB_OUTPUT
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # première fois ou push forcé, on ne soumet rien (sécurité)
            echo "files=" >> $GITHUB_OUTPUT
            echo "redirects=" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Pages ajoutées, modifiées OU supprimées (une page supprimée doit aussi être signalée)
          CHANGED=$(git diff --name-only --diff-filter=AMD "$BEFORE" "$AFTER" -- '*.html' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Pages modifiées : $CHANGED"
          # Nouvelles redirections ajoutées dans vercel.json (leur ancienne adresse doit être signalée)
          REDIRECTS=$(node -e '
            const {execSync} = require("child_process");
            const read = (sha) => { try { return JSON.parse(execSync(`git show ${sha}:vercel.json`).toString()); } catch (e) { return {}; } };
            const src = (cfg) => new Set((cfg.redirects || []).map(r => r.source).filter(s => s.startsWith("/") && !/[:*(]/.test(s)));
            const before = src(read(process.argv[1])), after = src(read(process.argv[2]));
            console.log([...after].filter(s => !before.has(s)).join(" "));
          ' "$BEFORE" "$AFTER")
          echo "redirects=$REDIRECTS" >> $GITHUB_OUTPUT
          echo "Nouvelles redirections : $REDIRECTS"

      - name: Regenerate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap.xml if changed
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regénération automatique du sitemap [skip ci]"
            # Retry en cas de push concurrent (ex: deux audits appliqués coup sur coup)
            success=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                success=1
                break
              fi
              echo "Push rejeté, nouvelle tentative ($i/5)..."
              sleep 3
            done
            if [ "$success" -ne 1 ]; then
              echo "Échec du push après plusieurs tentatives."
              exit 1
            fi
          else
            echo "sitemap.xml inchangé"
          fi

      - name: Build URL list
        id: urls
        run: |
          SITE="https://proactifsconseils.fr"
          URLS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL="${{ github.event.inputs.urls }}"
            if [ -n "$MANUAL" ]; then
              URLS="$MANUAL"
            else
              # Renvoi complet : toutes les URL du sitemap
              URLS=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | tr '\n' ' ')
            fi
          else
            for f in ${{ steps.changes.outputs.files }}; do
              # exclure les pages techniques ou non indexées
              case "$f" in
                404.html|merci-guide.html|merci-avis.html|guide-5-erreurs-patrimoniaux.html|mentions-legales.html|confidentialite.html|immobilier/honoraires.html) continue ;;
                docs/*|tests/*|prototypes/*|scripts/*|"Lead magnets/"*|"Audits SEO/"*|"Indexation auto/"*|partials/*) continue ;;
                blog/blog-maquette-*) continue ;;
              esac
              # convertir le chemin en URL canonique (sans .html, index → dossier)
              P="${f%.html}"
              if [ "$P" = "index" ]; then
                URL="$SITE/"
              elif [ "${P##*/}" = "index" ]; then
                URL="$SITE/${P%/index}"
              else
                URL="$SITE/$P"
              fi
              URLS="$URLS $URL"
            done
            for r in ${{ steps.changes.outputs.redirects }}; do
              URLS="$URLS $SITE$r"
            done
          fi
          URLS=$(echo "$URLS" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | xargs)
          echo "list=$URLS" >> $GITHUB_OUTPUT
          if [ -n "$URLS" ]; then
            echo "URLs à soumettre : $URLS"
          else
            echo "Aucune URL à soumettre."
          fi

      - name: Submit to IndexNow (Bing, Yandex, Seznam, Naver)
        if: steps.urls.outputs.list != ''
        run: |
          node scripts/submit-to-indexnow.js ${{ steps.urls.outputs.list }}
