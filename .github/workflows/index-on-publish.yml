name: Auto-index on publish

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs à soumettre manuellement (séparées par des espaces, vide = tout le sitemap)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet pour git diff + git log lastmod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed HTML files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.urls }}" ]; then
            # Soumission manuelle d'URLs explicites
            echo "manual_urls=${{ github.event.inputs.urls }}" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            # Détecter les .html ajoutés ou modifiés dans le push
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # première fois ou push forcé, on ne soumet rien (sécurité)
              echo "files=" >> $GITHUB_OUTPUT
            else
              CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.html' | tr '\n' ' ')
              echo "files=$CHANGED" >> $GITHUB_OUTPUT
              echo "Fichiers HTML modifiés : $CHANGED"
            fi
            echo "manual_urls=" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap.xml if changed
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regénération automatique du sitemap [skip ci]"
            # Retry en cas de push concurrent (ex: deux audits appliqués coup sur coup)
            success=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                success=1
                break
              fi
              echo "Push rejeté, nouvelle tentative ($i/5)..."
              sleep 3
            done
            if [ "$success" -ne 1 ]; then
              echo "Échec du push après plusieurs tentatives."
              exit 1
            fi
          else
            echo "sitemap.xml inchangé"
          fi

      - name: Build URL list from changed files
        id: urls
        run: |
          MANUAL="${{ steps.changes.outputs.manual_urls }}"
          FILES="${{ steps.changes.outputs.files }}"
          URLS=""
          if [ -n "$MANUAL" ]; then
            URLS="$MANUAL"
          elif [ -n "$FILES" ]; then
            for f in $FILES; do
              # exclure 404, merci, etc.
              case "$f" in
                404.html|merci-guide.html|guide-5-erreurs-patrimoniaux.html) continue ;;
              esac
              # convertir le path en URL canonique
              if [ "$f" = "index.html" ]; then
                URL="https://proactifsconseils.fr/"
              elif [ "$f" = "blog/index.html" ]; then
                URL="https://proactifsconseils.fr/blog"
              else
                # retire .html
                URL="https://proactifsconseils.fr/${f%.html}"
              fi
              URLS="$URLS $URL"
            done
          fi
          URLS=$(echo "$URLS" | xargs)  # trim
          echo "list=$URLS" >> $GITHUB_OUTPUT
          if [ -n "$URLS" ]; then
            echo "URLs à indexer : $URLS"
          else
            echo "Aucune URL à indexer."
          fi

      - name: Submit to Google Indexing API
        if: steps.urls.outputs.list != ''
        env:
          GOOGLE_INDEXING_API_KEY: ${{ secrets.GOOGLE_INDEXING_API_KEY }}
        run: |
          node scripts/submit-to-google.js ${{ steps.urls.outputs.list }}

      - name: Submit to IndexNow (Bing + Yandex)
        if: steps.urls.outputs.list != ''
        run: |
          node scripts/submit-to-indexnow.js ${{ steps.urls.outputs.list }}

      - name: Ping Google sitemap
        if: steps.urls.outputs.list != ''
        run: |
          curl -fsS "https://www.google.com/ping?sitemap=https://proactifsconseils.fr/sitemap.xml" || true
