<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Merci pour votre retour | Proactifs Conseils</title>
  <meta name="description" content="Merci d'avoir donné votre avis sur le nouveau site Proactifs Conseils.">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P53RQGXJZX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P53RQGXJZX');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #FAFAF7;
      --forest: #132D1E;
      --forest-mid: #1C3D28;
      --ink: #111827;
      --ink-soft: #374151;
      --gold: #C4973A;
      --gold-light: #E8C97A;
      --teal: #1E7A6E;
      --slate: #6B7280;
      --border: #E5E2DA;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { overflow: hidden; }

    /* ── Background iframe ─────────────────────── */
    #bg-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      z-index: 0;
    }

    /* ── Dark overlay ──────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 12, 0.62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      animation: overlayIn 0.25s ease;
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Modal card ────────────────────────────── */
    .card {
      background: var(--ivory);
      border-radius: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.40), 0 6px 20px rgba(0,0,0,0.18);
      max-width: 500px;
      width: 100%;
      padding: 48px 44px 40px;
      position: relative;
      text-align: center;
      animation: cardIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes cardIn {
      from { transform: translateY(28px) scale(0.96); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 14px; right: 14px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(19, 45, 30, 0.07);
      border-radius: 50%;
      text-decoration: none;
      color: var(--ink-soft);
      font-size: 17px;
      font-weight: 300;
      transition: background 0.18s;
      font-family: 'DM Sans', sans-serif;
    }
    .close-btn:hover { background: rgba(19, 45, 30, 0.15); }

    /* Brand label */
    .brand {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
      display: block;
    }

    /* Stars */
    .stars {
      font-size: 30px;
      letter-spacing: 5px;
      padding-left: 5px;
      margin-bottom: 20px;
    }
    .stars .on  { color: var(--gold); }
    .stars .off { color: #D1D5DB; }

    /* Title */
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 14px;
    }
    h1 em { color: var(--gold); font-style: italic; }

    /* Lead text */
    p.lead {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink-soft);
      margin-bottom: 28px;
      text-align: center;
    }

    /* CTA button */
    .btn {
      display: inline-block;
      background: var(--forest);
      color: var(--gold-light);
      padding: 14px 34px;
      border-radius: 40px;
      border: 1.5px solid var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      background: var(--forest-mid);
      box-shadow: 0 6px 20px rgba(19,45,30,0.25);
    }

    /* Sub text */
    .sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--slate);
      margin-top: 16px;
      line-height: 1.6;
    }
    .sub a { color: var(--teal); text-decoration: none; }
    .sub a:hover { text-decoration: underline; }

    /* Divider */
    .divider {
      width: 40px;
      height: 2px;
      background: var(--gold);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    @media (max-width: 540px) {
      .card { padding: 40px 24px 32px; }
      h1    { font-size: 22px; }
      .stars { font-size: 26px; letter-spacing: 3px; }
    }
  </style>
</head>
<body>

  <!-- Site en arrière-plan -->
  <iframe id="bg-frame" src="https://proactifsconseils.fr/" title="Proactifs Conseils" loading="eager"></iframe>

  <!-- Popup modal -->
  <div id="overlay">
    <div class="card">

      <a href="/" class="close-btn" onclick="closeModal(event)" title="Fermer">&#x2715;</a>

      <span class="brand">Proactifs Conseils</span>
      <div class="divider"></div>

      <div class="stars" id="stars"></div>
      <h1 id="title">Merci pour votre retour.</h1>
      <p class="lead" id="lead">Votre retour nous aide à améliorer le cabinet jour après jour.</p>
      <div id="cta"></div>
      <p class="sub" id="sub"></p>

    </div>
  </div>

  <script>
    function closeModal(e) {
      e.preventDefault();
      var overlay = document.getElementById('overlay');
      overlay.style.transition = 'opacity 0.2s ease';
      overlay.style.opacity = '0';
      setTimeout(function() {
        overlay.style.display = 'none';
        document.body.style.overflow = 'auto';
      }, 200);
    }

    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw  = params.get('note');
      var note = parseInt(raw, 10);
      if (isNaN(note) || note < 1 || note > 5) note = 0;

      // Étoiles
      if (note > 0) {
        var s = '';
        for (var i = 1; i <= 5; i++) {
          s += '<span class="' + (i <= note ? 'on' : 'off') + '">★</span>';
        }
        document.getElementById('stars').innerHTML = s;
      } else {
        document.getElementById('stars').style.display = 'none';
      }

      var title = document.getElementById('title');
      var lead  = document.getElementById('lead');
      var cta   = document.getElementById('cta');
      var sub   = document.getElementById('sub');

      if (note >= 4) {
        title.innerHTML   = 'Merci, ça nous <em>touche</em>.';
        lead.textContent  = "Votre satisfaction est notre plus belle récompense. Si vous avez 30 secondes, partagez-la : un avis Google aide énormément le cabinet.";
        cta.innerHTML     = '<a class="btn" href="https://g.page/r/CWxnwzIxzBfIEBM/review" target="_blank" rel="noopener">Laisser un avis Google</a>';
        sub.innerHTML     = 'Merci du fond du cœur. <a href="/">Retour au site</a>';
      } else if (note >= 1) {
        title.innerHTML   = 'Merci pour votre <em>franchise</em>.';
        lead.textContent  = "C'est en sachant ce qui vous a gêné que je peux faire mieux. Dites-moi en deux mots ce qui mériterait d'être amélioré, je lis chaque message personnellement.";
        cta.innerHTML     = '<a class="btn" href="mailto:medymatima@proactifsconseils.fr?subject=Mon%20retour%20sur%20le%20nouveau%20site&body=Voici%20ce%20qui%20m%C3%A9riterait%20d\'%C3%AAtre%20am%C3%A9lior%C3%A9%20:%0A%0A">Donner mon avis</a>';
        sub.innerHTML     = 'Ou par téléphone au <a href="tel:+33184782830">01 84 78 28 30</a>. <a href="/">Retour au site</a>';
      } else {
        title.innerHTML   = 'Merci pour votre <em>retour</em>.';
        lead.textContent  = "Votre avis compte et nous aide à progresser.";
        cta.innerHTML     = '<a class="btn" href="/">Découvrir le site</a>';
      }
    })();
  </script>

</body>
</html>
